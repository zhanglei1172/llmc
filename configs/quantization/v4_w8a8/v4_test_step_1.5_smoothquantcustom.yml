base:
    seed: &seed 0
model:
    type: Qwen25VL_V4
    path: /code/llmc_test/work/out_v4_test/v4-0624/w8a8/spinquant/transformed_model/
    torch_dtype: torch.float32
calib:
    name: pileval
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/calib/pileval
    n_samples: 512
    bs: 128
    seq_len: 512
    preproc: txt_general_preproc
    seed: *seed
eval:
  - eval_pos: [pretrain,transformed,fake_quant]
    name: wikitext2
    type: ppl
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    seq_len: 2048
    bs: 1
    inference_per_block: False
  - eval_pos: [pretrain,transformed,fake_quant]
    type: vqa
    name: [mmmu]
    download: False
    path: /workspace/lim42@xiaopeng.com/dataset/mme/
    bs: 1
    limit: 200  # Limit test num for evaluation
    inference_per_block: False
quant:
    method: SmoothQuantCustom
    weight:
        bit: 8
        symmetric: True
        granularity: per_channel
    act:
        granularity: per_tensor
        static: True
        calib_algo: static_minmax
        bit: 8
        symmetric: True
        # granularity: per_token
    special:
        alpha: 0.8
        selected_layers: ["mlp.down_proj"]
