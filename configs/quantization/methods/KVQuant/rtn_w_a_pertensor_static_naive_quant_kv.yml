base:
    seed: &seed 42
model:
    type: Qwen25VL_V4
    path: /code/zhangl98@xiaopeng.com/llmc_test/work/out_v4_spinquant_gptq_smoothquant/fake_quant_model/
    torch_dtype: auto
calib:
    name: wikitext2
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/calib/wikitext2
    n_samples: 128
    bs: 1
    seq_len: 2048
    preproc: wikitext2_gptq
    seed: *seed
eval:
    eval_pos: [transformed, fake_quant, fake_quant_wo_kv] #long_ppl eval not support pretrain eval pos
    name: wikitext2
    type: ppl
    download: False
    seq_len: 2048
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    bs: 1
    inference_per_block: False
    preproc: wikitext2_gptq
    # num_samples: 10
    # num_eval_tokens: 3
    seed: *seed
quant:
    method: RTN
    weight:
        bit: 8
        symmetric: True
        granularity: per_channel
        group_size: -1
    act:
        bit: 8
        symmetric: True
        granularity: per_tensor
        calib_algo: static_minmax
        static: True
    kvcache:
        method: Naive
        bit: 8
        symmetric: True
        granularity: per_tensor
        calib_algo: static_minmax
        quantize_k: True
        quantize_v: True
