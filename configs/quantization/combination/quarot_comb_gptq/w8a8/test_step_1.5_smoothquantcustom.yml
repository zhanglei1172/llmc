base:
    seed: &seed 0
model:
    type: Qwen25VL
    path: /code/zhangl98@xiaopeng.com/llmc_test/work/out_qwen25vl_spinquant_gptq/transformed_model/
    torch_dtype: auto
calib:
    name: pileval
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/calib/pileval
    n_samples: 512
    bs: 1
    seq_len: 512
    preproc: txt_general_preproc
    seed: *seed
eval:
    eval_pos: [pretrain, transformed, fake_quant]
    name: wikitext2
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    seq_len: 2048
    # For 7B / 13B model eval, bs can be set to "1", and inference_per_block can be set to "False".
    # For 70B model eval, bs can be set to "20", and inference_per_block can be set to "True".
    bs: 1
    inference_per_block: False
quant:
    method: SmoothQuantCustom
    weight:
        bit: 8
        symmetric: True
        granularity: per_channel
    act:
        bit: 8
        symmetric: True
        granularity: per_token
    special:
        alpha: 0.8
        selected_layers: ["mlp.down_proj"]
save:
    save_trans: True
    save_fake: True
    save_path: /code/zhangl98@xiaopeng.com/llmc_test/work/out_qwen25vl_spinquant_gptq_smoothquant
