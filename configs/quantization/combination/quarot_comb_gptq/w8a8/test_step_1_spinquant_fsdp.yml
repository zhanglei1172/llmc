base:
    seed: &seed 0
model:
    type: Qwen25VL
    path: /workspace/gaoy25@xiaopeng.com/v3_datas/original_model/v0-20250601-000047/
    tokenizer_mode: slow
    torch_dtype: auto
eval:
    eval_pos: [pretrain, transformed, fake_quant]
    name: wikitext2
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    seq_len: 2048
    # For 7B / 13B model eval, bs can be set to "1", and inference_per_block can be set to "False".
    # For 70B model eval, bs can be set to "20", and inference_per_block can be set to "True".
    bs: 20
    inference_per_block: True
quant:
    method: SpinQuant
    weight:
        bit: 8
        symmetric: True
        granularity: per_channel
        group_size: -1
        calib_algo: 
        ste: True
    act:
        bit: 8
        symmetric: True
        granularity: per_token
        qmax_to_tensor: True
        ste: True
    special:
        rotate_mode: hadamard
        fp32_had: True
        online_rotate: False
train:
    data:
        name: wikitext2
        download: False
        path: /workspace/zhangl98@xiaopeng.com/dataset/calib/wikitext2/
        n_samples: 800
        bs: 1
        seq_len: 2048
        preproc: wikitext2_gptq
        seed: *seed
        cache_dir: 
    train_args:
        seed: *seed
        fp16: False
        # bf16: True
        bf16: False
        log_on_each_node: False
        per_device_train_batch_size: 4
        logging_steps: 1
        learning_rate: 1.
        weight_decay: 0.
        lr_scheduler_type: "cosine"
        gradient_checkpointing: True
        max_steps: 100
        output_dir: ./out/
        logging_dir: ./log/
        logging_first_step: True
        report_to: 
        fsdp: "full_shard auto_wrap"
        fsdp_transformer_layer_cls_to_wrap: "Qwen2_5_VLDecoderLayer"
        ddp_find_unused_parameters: True
        fsdp_config:
            # activation_checkpointing: True
            use_orig_params: True
        # eval_strategy: "steps"
        # load_best_model_at_end: True
        # save_total_limit: 1
save:
    # Save the Spinquant-transformed model.
    save_rotate_weight: True
    save_trans: True
    save_fake: False
    save_path: /code/zhangl98@xiaopeng.com/llmc_test/work/out_qwen25vl_spinquant
