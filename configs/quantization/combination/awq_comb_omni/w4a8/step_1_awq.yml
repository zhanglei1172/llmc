base:
    seed: &seed 0
model:
    type: Qwen25VL
    path: /dataset/workspace/zhangl98/models/Qwen2.5-VL-7B-Instruct
    tokenizer_mode: slow
    torch_dtype: torch.float32
calib:
    name: pileval
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/calib/pileval
    n_samples: 128
    bs: -1
    seq_len: 512
    preproc: txt_general_preproc
    seed: *seed
eval:
    eval_pos: [transformed, fake_quant]
    name: wikitext2
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    seq_len: 2048
    # For 7B / 13B model eval, bs can be set to "1", and inference_per_block can be set to "False".
    # For 70B model eval, bs can be set to "20", and inference_per_block can be set to "True".
    bs: 1
    inference_per_block: False
ignored_layers:
    block_ids: [0-28]
    layer_names: ["mlp.down_proj"]
quant:
    method: Awq
    weight:
        bit: 4
        symmetric: True
        granularity: per_channel
        group_size: -1
        calib_algo: minmax
        # calib_algo: learnable
    act:
        bit: 16
        symmetric: True
        granularity: per_tensor
        calib_algo: minmax
    special:
        trans: True
        trans_version: v2
        weight_clip: True
        # Only the version v2 clipping method supports saving clip factors.
        # And the weight calibration algorithm must be set to "learnable".
        clip_version: v1
        # # Save scale and clip factors for OmniQuant's LWC and LET.
        # save_scale: True
        # scale_path: /code/tmp_/scale
        # save_clip: True
        # clip_path: /code/tmp_/clip
        selected_layers: ['mlp.down_proj']
