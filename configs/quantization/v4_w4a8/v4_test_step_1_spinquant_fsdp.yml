base:
    seed: &seed 0
model:
    type: Qwen25VL_V4
    path: /workspace/gaoy25@xiaopeng.com/v4_datas/v4_ckpts/v12-20250731-232339/checkpoint-17540/
    tokenizer_mode: slow
    torch_dtype: torch.float32
eval:
    eval_pos: [transformed, fake_quant]
    name: wikitext2
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    seq_len: 2048
    # For 7B / 13B model eval, bs can be set to "1", and inference_per_block can be set to "False".
    # For 70B model eval, bs can be set to "20", and inference_per_block can be set to "True".
    bs: 1
    inference_per_block: False
quant:
    method: SpinQuant
    weight:
        bit: 4
        symmetric: True
        granularity: per_channel
        group_size: -1
        calib_algo: 
        ste: True
    act:
        bit: 8
        symmetric: True
        granularity: per_tensor
        qmax_to_tensor: True
        ste: True
    special:
        rotate_mode: hadamard
        fp32_had: True
        online_rotate: False
ignored_layers:
    block_ids: [0-28]
    layer_names: ["mlp.down_proj"]
train:
    data:
        - 
            name: wikitext2
            download: False
            path: /workspace/zhangl98@xiaopeng.com/dataset/calib/wikitext2/
            n_samples: 400
            bs: 1
            seq_len: 2048
            preproc: wikitext2_gptq
            seed: *seed
            cache_dir: 
        # -
        #     name: V4_mmmu
        #     download: False
        #     path: ./xq_eval/datasets_v4/mmmu_val_489_calib_368length.json
        #     n_samples: 200
        #     bs: 1
        #     seq_len: 2048
        #     preproc: v4_general_preproc
        #     seed: *seed
        #     cache_dir: 
        # - 
        #     name: V4_feedback
        #     download: False
        #     path: ./xq_eval/datasets_v4/train_memory_v3_002.json
        #     n_samples: 200
        #     bs: 1
        #     seq_len: 2048
        #     preproc: v4_general_preproc
        #     seed: *seed
        # - 
        #     name: V4_oms
        #     download: False
        #     path: ./xq_eval/datasets_v4/test_v2_6_0728v8-相对坐标-right-560px.json
        #     n_samples: 200
        #     bs: 1
        #     seq_len: 2048
        #     preproc: v4_general_preproc
        #     seed: *seed
        # - 
        #     name: V4_alpaca
        #     download: False
        #     path: ./xq_eval/datasets_v4/alpaca_zh_data_300_calib.json
        #     n_samples: 200
        #     bs: 1
        #     seq_len: 2048
        #     preproc: v4_general_preproc
        #     seed: *seed
    train_args:
        seed: *seed
        fp16: False
        # bf16: True
        bf16: False
        log_on_each_node: False
        per_device_train_batch_size: 4
        logging_steps: 1
        learning_rate: 1.
        weight_decay: 0.
        lr_scheduler_type: "cosine"
        gradient_checkpointing: True
        max_steps: 400
        output_dir: ./out/
        logging_dir: ./log/
        logging_first_step: True
        report_to: 
        fsdp: "full_shard auto_wrap"
        fsdp_transformer_layer_cls_to_wrap: "Qwen2_5_VLDecoderLayer"
        ddp_find_unused_parameters: True
        fsdp_config:
            # activation_checkpointing: True
            use_orig_params: True
        # eval_strategy: "steps"
        # load_best_model_at_end: True
        # save_total_limit: 1
save:
    # Save the Spinquant-transformed model.
    save_rotate_weight: True
    save_trans: True
    save_fake: True
    save_path: /code/llmc_test/work/out_v4_test/v4-0807/w4a8/spinquant_custom_4data
