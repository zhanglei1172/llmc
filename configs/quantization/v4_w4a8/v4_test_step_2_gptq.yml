base:
    seed: &seed 0
model:
    type: Qwen25VL_V4
    # Load spinquant-transformed model
    path: /dataset/workspace/zhangl98/ost_qwen/w4a8/exp1_sp/transformed_model 
    torch_dtype: torch.float32
calib:
    name: wikitext2
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/calib/wikitext2/
    n_samples: 512
    bs: 8
    seq_len: 2048
    preproc: wikitext2_gptq
    seed: *seed
eval:
  - eval_pos: [transformed,fake_quant]
    name: wikitext2
    type: ppl
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    seq_len: 2048
    bs: 1
    inference_per_block: False
#   - eval_pos: [transformed,fake_quant]
#     type: vqa
#     name: [mmmu]
#     download: False
#     path: /workspace/lim42@xiaopeng.com/dataset/mme/
#     bs: 1
#     limit: 200  # Limit test num for evaluation
#     inference_per_block: False
# ignored_layers:
#     block_ids: [0-28]
#     layer_names: ["mlp.down_proj"]
quant:
    method: GPTQ
    weight:
        bit: 4
        symmetric: True
        granularity: per_channel
        group_size: -1
        calib_algo: mse
    act:
        bit: 8
        symmetric: True
        granularity: per_tensor
        quant_attn: True
        # static: True
        # calib_algo: static_minmax
    special:
        actorder: True
        static_groups: True
        percdamp: 0.01
        blocksize: 128
        chunk_num: 4
        true_sequential: True
        online_rotate: False
        fp32_had: True
    quant_out: True
save:
    # save_trans: True
    save_fake: True
    # save_path: /code/zhangl98@xiaopeng.com/llmc_test/work/out_qwen25vl_quarot_gptq
    save_path: /dataset/workspace/zhangl98/ost_qwen/w4a8/exp1_sp_gptq 
