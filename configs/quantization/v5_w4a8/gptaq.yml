eval:
    - 
        eval_pos: [transformed, fake_quant]
        name: wikitext2
        type: ppl
        download: False
        path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
        seq_len: 2048
        bs: 1
        inference_per_block: False
