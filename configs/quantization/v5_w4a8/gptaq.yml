quant:
    method: GPTAQ
    weight:
        bit: 4
        symmetric: True
        granularity: per_channel
        group_size: -1
        calib_algo: mse
        # minmax_fix: True
    # act:
    #     bit: 8
    #     symmetric: True
    #     granularity: per_tensor
    #     # static: True
    #     calib_algo: minmax
    #     mix_bits:
