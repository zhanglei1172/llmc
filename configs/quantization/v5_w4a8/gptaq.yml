    #                 granularity: per_channel
    #                 calib_algo: mse
    #             act:
    #                 bit: 16
    #                 symmetric: True
    #                 granularity: per_tensor
    special:
        actorder: True
        static_groups: True
        percdamp: 0.01
        apha: 0.25
        blocksize: 128
        chunk_num: 4
        true_sequential: True
        online_rotate: False
        fp32_had: True
        # selected_layers: ["self_attn.v_proj", "mlp.up_proj", "mlp.down_proj", "mlp.gate_proj"]
        # selected_blocks: ['26-28']
    quant_out: True
