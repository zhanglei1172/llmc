base:
    seed: &seed 0
model:
    type: Qwen25VL_V4
    # Load spinquant-transformed model
    path: /code/llmc_test/work/out_v4_spinquant/transformed_model/
    torch_dtype: torch.bfloat16
calib:
    name: wikitext2
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/calib/wikitext2/
    n_samples: 512
    bs: 1
    seq_len: 2048
    preproc: wikitext2_gptq
    seed: *seed
eval:
  - eval_pos: [pretrain,transformed,fake_quant]
    name: wikitext2
    type: ppl
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    seq_len: 2048
    bs: 1
    inference_per_block: False
#   - eval_pos: [pretrain,transformed,fake_quant]
#     type: vqa
#     name: [mmmu]
#     download: False
#     path: /workspace/lim42@xiaopeng.com/dataset/mme/
#     bs: 1
#     limit: 200  # Limit test num for evaluation
#     inference_per_block: False
quant:
    method: GPTQ
    weight:
        bit: 4
        symmetric: True
        granularity: per_channel
        group_size: -1
        calib_algo: mse
    act:
        bit: 16
        static: True
        calib_algo: static_minmax
        symmetric: True
        granularity: per_tensor
        # calib_algo: minmax
    special:
        actorder: True
        static_groups: True
        percdamp: 0.01
        blocksize: 128
        chunk_num: 4
        true_sequential: True
        online_rotate: False
        fp32_had: True
    quant_out: True
