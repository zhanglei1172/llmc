base:
    seed: &seed 0
model:
    type: Qwen25VL_V4
    path: /code/llmc_test/work/out_v4_spinquant/transformed_model/
    torch_dtype: auto
eval:
  - eval_pos: [pretrain,transformed,fake_quant]
    name: wikitext2
    type: ppl
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    seq_len: 2048
    bs: 1
    inference_per_block: False
  - eval_pos: [pretrain,transformed,fake_quant]
    type: vqa
    name: [mmmu]
    download: False
    path: /workspace/lim42@xiaopeng.com/dataset/mme/
    bs: 1
    limit: 200  # Limit test num for evaluation
    inference_per_block: False
quant:
    vision:
        method: Quarot
        weight:
            bit: 8
            symmetric: True
            granularity: per_channel
            group_size: -1
            calib_algo: minmax
        act:
            bit: 16
            symmetric: True
            granularity: per_tensor
        special:
            rotate_mode: hadamard
            fp32_had: True
            online_rotate: False
    language:
        method: RTN
        weight:
            bit: 4
            symmetric: True
            granularity: per_channel
            group_size: -1
            calib_algo: minmax
        act:
            bit: 16
            symmetric: True
            granularity: per_tensor
        special:
            rotate_mode: hadamard
            fp32_had: True
            online_rotate: False
save:
    save_trans: True
    save_fake: True
    save_path: /code/llmc_test/work/out_v4_test/v4-0624/quarot
