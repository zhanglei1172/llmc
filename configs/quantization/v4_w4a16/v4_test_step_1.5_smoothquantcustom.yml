base:
    seed: &seed 0
model:
    type: Qwen25VL_V4
    path: /code/llmc_test/work/out_v4_test/v4-0624/w4a16/spinquant/transformed_model/
    torch_dtype: torch.float32
calib:
    name: pileval
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/calib/pileval
    n_samples: 512
    bs: 128
    seq_len: 512
    preproc: txt_general_preproc
    seed: *seed
eval:
    eval_pos: [transformed, fake_quant]
    name: wikitext2
    download: False
    path: /workspace/zhangl98@xiaopeng.com/dataset/eval/wikitext2/
    seq_len: 2048
    # For 7B / 13B model eval, bs can be set to "1", and inference_per_block can be set to "False".
    # For 70B model eval, bs can be set to "20", and inference_per_block can be set to "True".
    bs: 1
    inference_per_block: False
quant:
    method: SmoothQuantCustom
    weight:
        bit: 4
        symmetric: True
        granularity: per_channel
    act:
        granularity: per_tensor
        static: True
        calib_algo: static_minmax
        bit: 16
        symmetric: True
        # granularity: per_token
    special:
        alpha: x 
        selected_layers: ["self_attn.o_proj"]
        do_gqa_trans: True
